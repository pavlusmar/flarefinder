
name = "flarefinder"
main = "src/index.ts"
compatibility_date = "2025-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "flarefinder-db"
database_id = "62a86a76-432e-4595-894f-4ba8bce97cd7"
migrations_dir = "migrations"

[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *"]

[vars]
SEARCH_PROVIDER = "tavily"
ANALYSIS_MODEL = "@cf/openai/gpt-oss-120b"
EVALUATION_MODEL = "@cf/qwen/qwen3.8-27b"
PLANNER_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8-fast"
QUALITY_THRESHOLD = "85"
REVISION_LIMIT = "2"
ANALYST_MODELS = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"

# Set secrets securely using:
# npx wrangler secret put SEARCH_API_KEY
# npx wrangler secret put ADMIN_TOKEN

# Cloudflare Observability
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Durable account-research processing: one account per queue delivery.
[[queues.producers]]
queue = "flarefinder-research"
binding = "RESEARCH_QUEUE"

[[queues.consumers]]
queue = "flarefinder-research"
max_batch_size = 1
max_batch_timeout = 2
max_retries = 4
max_concurrency = 10
retry_delay = 30
dead_letter_queue = "flarefinder-research-dlq"
