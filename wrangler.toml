name = "flarefinder"
main = "src/index.ts"
compatibility_date = "2025-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "flarefinder-db"
database_id = "62a86a76-432e-4595-894f-4ba8bce97cd7"
migrations_dir = "migrations"

[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *"]

[vars]
SEARCH_PROVIDER = "tavily"
# Set SEARCH_API_KEY securely with: npx wrangler secret put SEARCH_API_KEY
# Set ADMIN_TOKEN securely with: npx wrangler secret put ADMIN_TOKEN
