name: Offline research validation
on:
  push:
    branches: [fix/evidence-rubric-validation, fix/opportunity-recovery-9fin, fix/evidence-pipeline-audit, fix/brief-commercial-narrative, fix/compact-brief-job-triggers]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run typecheck
      - run: node --check public/app.js
      - run: node --test tests/evidence.test.cjs
